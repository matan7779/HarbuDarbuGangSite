<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>מקרן חארבו דארבו</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(1200px,96vw);text-align:center;padding:24px}
.card{background:rgba(17,24,39,.96);border:1px solid rgba(148,163,184,.18);border-radius:28px;padding:42px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.title{font-size:clamp(44px,7vw,96px);font-weight:900;line-height:1.05;margin-bottom:20px}
.rules{font-size:clamp(22px,3vw,40px);color:#fbbf24;margin-bottom:24px}
.players{font-size:clamp(18px,2.2vw,30px);color:#cbd5e1}
.room{font-size:clamp(12px,1.25vw,18px);color:#64748b;margin-top:16px;font-weight:700;letter-spacing:.04em;direction:rtl}
.roomCodeText{direction:ltr;unicode-bidi:isolate;display:inline-block}
.boomFlash{display:inline-block;font-weight:900;animation:boomPulse .75s ease-in-out infinite}
@keyframes boomPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(1.12)}}
.trophy{font-size:clamp(72px,12vw,170px)}
.winner{font-size:clamp(62px,10vw,150px);font-weight:900}
.status{font-size:clamp(20px,2.4vw,34px);color:#cbd5e1;margin-top:18px}
.summaryWrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;text-align:right;direction:rtl}
.summarySection{background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.16);border-radius:20px;padding:24px}
.summarySection h2{margin:0 0 16px;font-size:clamp(24px,3vw,38px);text-align:center}
.summaryRow{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.13);font-size:clamp(18px,2vw,28px)}
.summaryRow .amount{direction:ltr;unicode-bidi:isolate}
.summaryRow:last-child{border-bottom:none}.pos{color:#4ade80;font-weight:900}.neg{color:#f87171;font-weight:900}.zer{color:#e2e8f0;font-weight:900}
input,button{font:inherit;border:none;border-radius:14px}
input{width:min(420px,85vw);padding:14px;text-align:center;font-size:22px;margin:16px 0;background:#fff;color:#111827}
button{padding:14px 22px;font-weight:900;background:#f59e0b;color:#111827;cursor:pointer}
.small{font-size:15px;color:#94a3b8;margin-top:12px}
.hidden{display:none!important}
@media(max-width:760px){.summaryWrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginBox">
    <div class="title" style="font-size:clamp(36px,5vw,68px)">קבוצת חארבו דארבו</div>
    <div class="status">תצוגת מקרן</div>
    <input id="code" type="password" placeholder="קוד כניסה לקבוצה" autocomplete="off">
    <br><button id="connect">התחבר</button>
    <div id="loginMsg" class="small"></div>
  </div>

  <div class="card hidden" id="displayBox">
    <div id="content"><div class="status">מתחבר לערב הנוכחי…</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=(window.HDG_SUPABASE_URL&&window.HDG_SUPABASE_KEY)?window.supabase.createClient(window.HDG_SUPABASE_URL,window.HDG_SUPABASE_KEY):null;
let groupKey='';let timer=null;let room='';
const PRICE=25;
const $=id=>document.getElementById(id);
const RULE_HE={
  '2 Boards':'2 בורדים',
  '1 Board Stronger':'הבורד החזק לוקח',
  'Open / Close / Open Cards':'פתוח / סגור / קלפים פתוחים',
  'Insert 3 Cards':'מכניסים 3 קלפים',
  'Shared Card':'קלף משותף',
  '7 Boom':'7 בום',
  'Regular':'רגיל'
};
async function sha256(text){const b=new TextEncoder().encode(text);const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(name,args={}){if(!db)throw new Error('Supabase is not configured.');const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ruleHe(r){const t=String(r??'').trim();return RULE_HE[t]||t}
function renderRules(rules){
  if(!Array.isArray(rules)||!rules.length)return 'רגיל';
  return rules.map(r=>{
    const raw=String(r).trim(),label=ruleHe(raw);
    return raw==='7 Boom'||raw==='7 בום'?`<span class="boomFlash">${esc(label)}</span>`:esc(label);
  }).join(' · ');
}
function fmtNet(v){v=Number(v)||0;return v>0?`+${v}₪`:v<0?`-${Math.abs(v)}₪`:'0₪'}
function renderSummary(s){
  const players=Array.isArray(s.players)?s.players:[];
  const games=Array.isArray(s.games)?s.games:[];
  if(!games.length){return `<div class="title">קבוצת חארבו דארבו</div><div class="rules">ממתינים למשחק הבא…</div><div class="players">${players.map(esc).join(' · ')}</div>`}
  const rebuys=s.rebuys&&typeof s.rebuys==='object'?s.rebuys:{};
  const cashout=s.cashout&&typeof s.cashout==='object'?s.cashout:{};
  const wins={};games.forEach(g=>(Array.isArray(g.winners)?g.winners:[]).forEach(w=>wins[w]=(wins[w]||0)+1));
  const moneyRows=players.map(p=>{const v=Number(cashout[p]||0)-Number(rebuys[p]||0)*PRICE;const cls=v>0?'pos':v<0?'neg':'zer';return `<div class="summaryRow"><span>${esc(p)}</span><span class="amount ${cls}">${fmtNet(v)}</span></div>`}).join('');
  const winRows=Object.entries(wins).sort((a,b)=>b[1]-a[1]).map(([p,c])=>`<div class="summaryRow"><span>${esc(p)}</span><span>${c}</span></div>`).join('')||'<div class="status" style="text-align:center">אין ניצחונות עדיין</div>';
  return `<div class="summaryWrap"><div class="summarySection"><h2>סיכום כספי</h2>${moneyRows}</div><div class="summarySection"><h2>ניצחונות</h2>${winRows}</div></div>`;
}
function render(s){
  if(!s){$('content').innerHTML='<div class="status">ממתינים לערב הנוכחי…</div>';return}
  if(s.liveStatus==='winner'&&Array.isArray(s.liveWinner)&&s.liveWinner.length){
    $('content').innerHTML=`<div class="trophy">🏆</div><div class="winner">${s.liveWinner.map(esc).join(' + ')}</div><div class="rules">${s.liveWinner.length>1?'חלוקת קופה':'מנצח'}</div>`;
  }else if(s.liveGame){
    $('content').innerHTML=`<div class="title">${esc(s.liveGame.name)}</div><div class="rules">${renderRules(s.liveGame.rules)}</div><div class="players">${Array.isArray(s.players)?s.players.map(esc).join(' · '):''}</div><div class="room">חדר <span class="roomCodeText">${esc(s.room||room)}</span></div>`;
  }else{
    $('content').innerHTML=renderSummary(s);
  }
}
async function renderLastClosedNight(){
  const rows=await rpc('hdg_get_old_nights',{p_group_key:groupKey});
  const nights=Array.isArray(rows)?rows:[];
  if(!nights.length){$('content').innerHTML='<div class="status">אין ערב פעיל כרגע.<br>התחל ערב בטלפון והמסך יתחבר אוטומטית.</div>';return}
  render(nights[0]);
}
async function startDisplay(){
  const current=await rpc('hdg_get_open_night',{p_group_key:groupKey});
  if(!current||!current.room){room='';await renderLastClosedNight();return}
  room=String(current.room).trim().toUpperCase();
  const s=await rpc('hdg_get_live',{p_group_key:groupKey,p_room_code:room});render(s||current);
}
async function loop(){try{await startDisplay()}catch(e){$('content').innerHTML=`<div class="status">${esc(e.message)}</div>`}}
async function useKey(key){groupKey=key;localStorage.setItem('hdg_projector_group_key',key);$('loginBox').classList.add('hidden');$('displayBox').classList.remove('hidden');await loop();if(timer)clearInterval(timer);timer=setInterval(loop,1000)}
$('connect').onclick=async()=>{try{$('loginMsg').textContent='בודק…';const key=await sha256($('code').value.trim());const ok=await rpc('hdg_check_group',{p_group_key:key});if(!ok){$('loginMsg').textContent='קוד הכניסה שגוי.';return}await useKey(key)}catch(e){$('loginMsg').textContent=e.message}};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('connect').click()});
(async()=>{const saved=localStorage.getItem('hdg_projector_group_key');if(saved){try{const ok=await rpc('hdg_check_group',{p_group_key:saved});if(ok){await useKey(saved);return}}catch(e){}}$('loginBox').classList.remove('hidden')})();
</script>
</body>
</html>
